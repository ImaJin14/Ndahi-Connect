# External availability probes for the portal, admin and API (OBS-005). Run
# blackbox_exporter next to Prometheus; the ndahi-probe job in prometheus.yml
# loads each URL once a minute.
modules:
  https_200:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      # A redirect would mean the page itself did not load.
      follow_redirects: false
      preferred_ip_protocol: ip4
