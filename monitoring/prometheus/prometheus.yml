# Scrape configuration for the NDAHI Connect API (PERF-001, PERF-005).
# Store METRICS_BEARER_TOKEN in the file referenced by credentials_file; never commit it.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ndahi-api
    scheme: https
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ndahi-metrics-token
    static_configs:
      - targets: ["api.ndahiconnect.net"]
