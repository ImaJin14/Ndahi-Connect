# Scrape configuration for the NDAHI Connect API (PERF-001, PERF-005).
# Store METRICS_BEARER_TOKEN in the file referenced by credentials_file; never commit it.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml
  - slo.yml

# Routes alerts by responder role; see monitoring/alertmanager/alertmanager.yml (OBS-004).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: ndahi-api
    scheme: https
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ndahi-metrics-token
    static_configs:
      - targets: ["api.ndahiconnect.net"]

  # External availability probes for the availability SLO (OBS-005), through a
  # blackbox_exporter on this host configured with monitoring/blackbox/blackbox.yml.
  - job_name: ndahi-probe
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [https_200]
    static_configs:
      - targets:
          - https://portal.ndahiconnect.net/login
          - https://admin.ndahiconnect.net/login
          - https://api.ndahiconnect.net/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
