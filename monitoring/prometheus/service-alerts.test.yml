# Service health alert tests (OBS-004).
# Run with: promtool test rules monitoring/prometheus/service-alerts.test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  # The database drops out at minute 6; the monitor keeps sampling on time.
  - interval: 1m
    input_series:
      - series: 'ndahi_database_up'
        values: '1x5 0x15'
      - series: 'ndahi_monitor_last_sample_timestamp_seconds'
        values: '0+60x20'
      - series: 'up{job="ndahi-api"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: NdahiDatabaseUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: NdahiDatabaseUnavailable
        exp_alerts:
          - exp_labels: { severity: critical, responder: platform-on-call }
            exp_annotations:
              summary: "The API's readiness probe cannot reach PostgreSQL"
      - eval_time: 10m
        alertname: NdahiMonitorStale
        exp_alerts: []

  # The monitor stops refreshing at minute 1, while the API is still scraped.
  - interval: 1m
    input_series:
      - series: 'ndahi_monitor_last_sample_timestamp_seconds'
        values: '60x30'
      - series: 'up{job="ndahi-api"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: NdahiMonitorStale
        exp_alerts:
          - exp_labels: { severity: warning, responder: platform-on-call }
            exp_annotations: &stale
              summary: "Queue and payment gauges have not refreshed for over 5 minutes"
              description: "Backlog alerts are blind until the API monitor samples again; check monitoring.sample_failed logs."

  # A running API that never reports a sample is also stale.
  - interval: 1m
    input_series:
      - series: 'up{job="ndahi-api"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: NdahiMonitorStale
        exp_alerts:
          - exp_labels: { severity: warning, responder: platform-on-call }
            exp_annotations: *stale

  # MeSomb fails 75% of 4 calls/minute. Flutterwave fails every call but makes
  # only 3 in 15 minutes, below the minimum volume, so it must not alert.
  - interval: 1m
    input_series:
      - series: 'ndahi_dependency_calls_total{dependency="payment",provider="mesomb",operation="createPayment",outcome="failure"}'
        values: '0+3x40'
      - series: 'ndahi_dependency_calls_total{dependency="payment",provider="mesomb",operation="createPayment",outcome="success"}'
        values: '0+1x40'
      - series: 'ndahi_dependency_calls_total{dependency="payment",provider="flutterwave",operation="verifyPayment",outcome="failure"}'
        values: '0+0.2x40'
      - series: 'ndahi_payments_attention{reason="uncertain"}'
        values: '1x40'
      - series: 'ndahi_payments_attention{reason="refund_requested"}'
        values: '0x40'
      - series: 'ndahi_queue_oldest_pending_seconds{queue="payments"}'
        values: '600x40'
      - series: 'ndahi_queue_oldest_pending_seconds{queue="payment_webhooks"}'
        values: '0+60x40'
      - series: 'ndahi_queue_dead_letters{queue="payment_webhooks"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: NdahiPaymentProviderErrors
        exp_alerts:
          - exp_labels: { provider: mesomb, severity: warning, responder: payments-owner }
            exp_annotations:
              summary: "More than 20% of mesomb calls are failing"
      - eval_time: 35m
        alertname: NdahiPaymentProviderDown
        exp_alerts:
          - exp_labels: { provider: mesomb, severity: critical, responder: payments-owner }
            exp_annotations:
              summary: "Most mesomb calls are failing; customers cannot pay"
      - eval_time: 35m
        alertname: NdahiPaymentsNeedReview
        exp_alerts:
          - exp_labels: { severity: warning, responder: payments-owner }
            exp_annotations:
              summary: "Payments need review or may have been charged without confirmation (1)"
      - eval_time: 35m
        alertname: NdahiRefundsAwaitingApproval
        exp_alerts: []
      - eval_time: 35m
        alertname: NdahiPaymentsStuckPending
        exp_alerts: []
      - eval_time: 10m
        alertname: NdahiWebhookBacklog
        exp_alerts: []
      - eval_time: 35m
        alertname: NdahiWebhookBacklog
        exp_alerts:
          - exp_labels: { severity: warning, responder: payments-owner }
            exp_annotations:
              summary: "Provider payment events have waited more than 15 minutes"
      - eval_time: 35m
        alertname: NdahiWebhookDeadLetters
        exp_alerts:
          - exp_labels: { severity: critical, responder: payments-owner }
            exp_annotations:
              summary: "Provider payment events stopped retrying (1); paid customers may lack access"

  # Half of emails fail: a warning, not a total outage. Security alerts dead-letter at minute 5.
  - interval: 1m
    input_series:
      - series: 'ndahi_dependency_calls_total{dependency="email",provider="email",operation="sendVoucher",outcome="failure"}'
        values: '0+1x60'
      - series: 'ndahi_dependency_calls_total{dependency="email",provider="email",operation="sendVoucher",outcome="success"}'
        values: '0+1x60'
      - series: 'ndahi_queue_oldest_pending_seconds{queue="security_alerts"}'
        values: '0x60'
      - series: 'ndahi_queue_dead_letters{queue="security_alerts"}'
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 50m
        alertname: NdahiEmailDeliveryErrors
        exp_alerts:
          - exp_labels: { severity: warning, responder: platform-on-call }
            exp_annotations:
              summary: "More than 20% of voucher, receipt, alert and PIN-reset emails are failing"
      - eval_time: 50m
        alertname: NdahiEmailDeliveryDown
        exp_alerts: []
      - eval_time: 20m
        alertname: NdahiSecurityAlertBacklog
        exp_alerts:
          - exp_labels: { severity: warning, responder: security-owner }
            exp_annotations:
              summary: "Customer security alerts are delayed or failed after 8 attempts"

  # Every email fails.
  - interval: 1m
    input_series:
      - series: 'ndahi_dependency_calls_total{dependency="email",provider="email",operation="sendPinReset",outcome="failure"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: NdahiEmailDeliveryDown
        exp_alerts:
          - exp_labels: { severity: critical, responder: platform-on-call }
            exp_annotations:
              summary: "Every email is failing; customers cannot receive vouchers or reset PINs"

  # The bridge fails nearly every call; Omada fails every status probe.
  - interval: 1m
    input_series:
      - series: 'ndahi_dependency_calls_total{dependency="router",provider="router",operation="syncVoucher",outcome="failure"}'
        values: '0+2x40'
      - series: 'ndahi_dependency_calls_total{dependency="router",provider="router",operation="readState",outcome="success"}'
        values: '0+0.25x40'
      - series: 'ndahi_queue_oldest_pending_seconds{queue="network_commands"}'
        values: '1000x40'
      - series: 'ndahi_queue_dead_letters{queue="network_commands"}'
        values: '0x40'
      - series: 'ndahi_dependency_calls_total{dependency="omada",provider="omada",operation="status",outcome="failure"}'
        values: '0+0.2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: NdahiRouterErrors
        exp_alerts:
          - exp_labels: { severity: warning, responder: network-operations }
            exp_annotations:
              summary: "More than 20% of RouterOS bridge calls are failing"
      - eval_time: 30m
        alertname: NdahiRouterUnreachable
        exp_alerts:
          - exp_labels: { severity: critical, responder: network-operations }
            exp_annotations:
              summary: "The RouterOS bridge is unreachable; vouchers are not reaching the hotspot"
      - eval_time: 30m
        alertname: NdahiNetworkCommandBacklog
        exp_alerts:
          - exp_labels: { severity: warning, responder: network-operations }
            exp_annotations:
              summary: "Router commands have waited more than 15 minutes"
      - eval_time: 30m
        alertname: NdahiNetworkCommandDeadLetters
        exp_alerts: []
      - eval_time: 30m
        alertname: NdahiOmadaUnreachable
        exp_alerts:
          - exp_labels: { severity: warning, responder: network-operations }
            exp_annotations:
              summary: "The Omada controller is failing its status probes"

  # 15 rejected customer logins per minute; about 7 rejected admin logins per 15 minutes.
  - interval: 1m
    input_series:
      - series: 'ndahi_auth_responses_total{actor="customer",outcome="rejected"}'
        values: '0+15x30'
      - series: 'ndahi_auth_responses_total{actor="customer",outcome="success"}'
        values: '0+40x30'
      - series: 'ndahi_auth_responses_total{actor="admin",outcome="rejected"}'
        values: '0+0.5x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: NdahiCustomerLoginFailuresHigh
        exp_alerts:
          - exp_labels: { severity: warning, responder: security-owner }
            exp_annotations:
              summary: "More than 10 customer logins per minute are rejected or throttled"
              description: "Possible credential guessing; review customer security events and rate-limit counters."
      - eval_time: 25m
        alertname: NdahiAdminLoginFailures
        exp_alerts:
          - exp_labels: { severity: warning, responder: security-owner }
            exp_annotations:
              summary: "Five or more administrator logins were rejected in 15 minutes"
      - eval_time: 25m
        alertname: NdahiAdminLoginAttack
        exp_alerts: []

  # Two rejected admin logins per minute is an attack; a single typo is not.
  - interval: 1m
    input_series:
      - series: 'ndahi_auth_responses_total{actor="admin",outcome="throttled"}'
        values: '0+2x30'
      - series: 'ndahi_auth_responses_total{actor="customer",outcome="rejected"}'
        values: '0 1x29'
    alert_rule_test:
      - eval_time: 25m
        alertname: NdahiAdminLoginAttack
        exp_alerts:
          - exp_labels: { severity: critical, responder: security-owner }
            exp_annotations:
              summary: "Twenty or more administrator logins were rejected in 15 minutes; likely an attack"
      - eval_time: 25m
        alertname: NdahiCustomerLoginFailuresHigh
        exp_alerts: []

  # A refund waits more than a day, a payment stays pending past 6 hours, and a
  # router command dead-letters.
  - interval: 1m
    input_series:
      - series: 'ndahi_payments_attention{reason="refund_requested"}'
        values: '1x1500'
      - series: 'ndahi_queue_oldest_pending_seconds{queue="payments"}'
        values: '22000x1500'
      - series: 'ndahi_queue_dead_letters{queue="network_commands"}'
        values: '2x1500'
    alert_rule_test:
      - eval_time: 23h
        alertname: NdahiRefundsAwaitingApproval
        exp_alerts: []
      - eval_time: 1450m
        alertname: NdahiRefundsAwaitingApproval
        exp_alerts:
          - exp_labels: { severity: warning, responder: payments-owner }
            exp_annotations:
              summary: "Customer refund requests have waited more than a day for approval"
      - eval_time: 20m
        alertname: NdahiPaymentsStuckPending
        exp_alerts:
          - exp_labels: { severity: warning, responder: payments-owner }
            exp_annotations:
              summary: "A payment has been pending for more than 6 hours"
      - eval_time: 5m
        alertname: NdahiNetworkCommandDeadLetters
        exp_alerts:
          - exp_labels: { severity: critical, responder: network-operations }
            exp_annotations:
              summary: "Router commands stopped retrying (2); customers may lack or keep access incorrectly"
