<!doctype html>
<html lang="en" data-ui-variant="v2"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#003b2b"><title>Your saved voucher — NDAHI Connect</title><link rel="stylesheet" href="/shared/ui/tokens.css"><link rel="stylesheet" href="/portal-voucher-ready.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="/assets/icons/icon-192.png"></head>
<body class="vready-page">
<div class="vready">
  <div class="vready__bar"><a class="vready__back" id="voucherBack" href="/dashboard#vouchers" aria-label="Back to vouchers"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg></a><span class="vready__title" id="voucherTitle">Your saved voucher</span></div>
  <main class="vready__main">
    <p class="vready__status" id="voucherStatus" role="status" aria-live="polite">Checking your account for the confirmed purchase…</p>
    <section class="vready__card" id="voucherDetails" aria-label="Voucher" hidden></section>
    <div class="vready__actions"><button type="button" class="vready__btn2" id="copyVoucher" hidden>Copy code</button><a class="vready__btn2" id="printVoucher" hidden>Print slip</a></div>
    <p class="vready__msg" id="downloadStatus" role="status" aria-live="polite"></p>
    <button type="button" class="vready__btn2 vready__retry" id="retryVoucher" hidden>Try loading again</button>
    <p class="vready__note" id="voucherNote" hidden>Give the code or slip to anyone — it starts the bundle on the device where it's entered. Each code works once.</p>
    <a class="vready__btn" id="continueVoucher" href="/dashboard" hidden>Use it on this device now</a>
  </main>
</div>
<script src="/config.js"></script><script type="module" src="/voucher-ready.js"></script></body></html>
