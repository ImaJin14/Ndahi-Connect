name: Redesign regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-regressions:
    name: Cold security routes and admin role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Syntax-check browser regression modules
        run: node --check test/redesign-browser/deep-links.test.mjs && node --check test/redesign-browser/permissions.test.mjs
      - name: Verify cold routes and role isolation on both UI variants
        run: node --test --test-timeout=90000 test/redesign-browser/*.test.mjs
