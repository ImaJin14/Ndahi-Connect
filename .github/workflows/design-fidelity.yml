name: Design fidelity

# AGENTS.md rule 10: a PR that changes a screen must show it matches the design.
# Re-runs when the PR description is edited, so fixing the section clears it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  design-fidelity:
    name: Screen matches the design
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-design-fidelity.mjs
