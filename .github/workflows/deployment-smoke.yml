name: Deployment smoke checks
on:
  workflow_dispatch:
    inputs:
      allow_bootstrap:
        description: Allow a bootstrap deployment (does not certify launch readiness)
        type: boolean
        default: false
  deployment_status:
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:deployment
        env:
          SMOKE_ALLOW_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_bootstrap && 'true' || 'false' }}
