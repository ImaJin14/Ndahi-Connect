<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Administrator login — NDAHI Connect</title><link rel="stylesheet" href="/styles.css"><meta name="theme-color" content="#003b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NDAHI Admin"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"></head><body>
<header><div class="brand">NDAHI <small>CONNECT ADMIN</small></div></header>
<main class="login-shell"><section class="card">
  <div id="credentialsStep">
    <p class="section-kicker">Secure sign-in</p><h1>Administrator access.</h1><p>Use your administrator PIN or an enrolled passkey.</p>
    <form id="login">
      <label>Username<input name="username" autocomplete="username" placeholder="Username" required autofocus></label>
      <label>PIN<span class="password-field"><input id="adminPassword" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required><button type="button" id="togglePassword" class="password-toggle" aria-label="Show PIN" aria-pressed="false">Show</button></span></label>
      <button>Continue</button><button type="button" class="secondary-action" id="passkeyLogin">Sign in with a passkey</button>
    </form>
  </div>
  <p id="message" class="error" role="alert" aria-live="assertive"></p>
</section></main>
<script src="/config.js"></script><script src="/vendor/webauthn.js"></script><script type="module" src="/install.js"></script><script type="module" src="/login.js"></script></body></html>
