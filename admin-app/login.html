<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Administrator login — NDAHI Connect</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">NDAHI <small>CONNECT ADMIN</small></div></header><main class="login-shell"><section class="card"><h1>Administrator access.</h1><p>Use your named account. Passkeys are the preferred, phishing-resistant sign-in method.</p><form id="login"><label>Username<input name="username" autocomplete="username" value="owner" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label>MFA code <small>(password fallback only)</small><input name="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button>Sign in securely</button><button type="button" class="secondary-action" id="passkeyLogin">Sign in with a passkey</button></form><p id="message" class="error" role="alert" aria-live="assertive"></p></section></main><script src="/config.js"></script><script src="/vendor/webauthn.js"></script><script type="module" src="/login.js"></script></body></html>
