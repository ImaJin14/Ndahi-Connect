<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Administrator login — NDAHI Connect</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand">NDAHI <small>CONNECT ADMIN</small></div></header>
<main class="login-shell"><section class="card">
  <div id="credentialsStep">
    <p class="section-kicker">Step 1 of 2</p><h1>Administrator access.</h1><p>Enter your named account credentials, or use an enrolled passkey.</p>
    <form id="login">
      <label>Username<input name="username" autocomplete="username" placeholder="Username" required autofocus></label>
      <label>Password<span class="password-field"><input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" aria-pressed="false">Show</button></span></label>
      <button>Continue</button><button type="button" class="secondary-action" id="passkeyLogin">Sign in with a passkey</button>
    </form>
  </div>
  <div id="mfaStep" hidden>
    <p class="section-kicker">Step 2 of 2</p><h1>Verify it’s you.</h1><p>Enter the six-digit code from your authenticator app.</p>
    <form id="mfaLogin"><label>Authenticator code<input name="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required></label><button>Verify and sign in</button><button type="button" class="secondary-action" id="backToCredentials">Back</button></form>
  </div>
  <p id="message" class="error" role="alert" aria-live="assertive"></p>
</section></main>
<script src="/config.js"></script><script src="/vendor/webauthn.js"></script><script type="module" src="/login.js"></script></body></html>
