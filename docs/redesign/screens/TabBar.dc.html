<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 74px; box-sizing: border-box; display: flex; background: #fffef9; border-top: 1px solid #dfe5dc; padding: 4px 4px 14px; font-family: 'DM Sans', system-ui, sans-serif; color: #5c6963">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
    <a href="{{t.href}}" aria-current="{{t.cur}}" style="{{t.style}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="{{t.sw}}" stroke-linejoin="round" stroke-linecap="round"><path d="{{t.d}}"></path></svg>{{t.label}}</a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","internet","shop","activity","account"],"default":"home"},"$preview":{"width":390,"height":74}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'home';
    const base = 'flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; font-size: 11px; font-weight: 600; border-radius: 10px; ';
    const tabs = [
      ['home', 'Home', 'PhoneHome.dc.html', 'M3 10 12 3l9 7v11h-6v-7H9v7H3Z'],
      ['internet', 'Internet', 'PhoneInternet.dc.html', 'M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01'],
      ['shop', 'Shop', 'PhoneShop.dc.html', 'M3 9h18l-2-6H5Zm2 0v12h14V9M9 21v-7h6v7'],
      ['activity', 'Activity', 'PhoneActivity.dc.html', 'M4 3h16v19l-4-2-4 2-4-2-4 2Zm4 5h8M8 12h8M8 16h5'],
      ['account', 'Account', 'PhoneAccount.dc.html', 'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 6 0 0 1 16 0v2']
    ].map(([id, label, href, d]) => {
      const on = id === current;
      return { label, href, d, cur: on ? 'page' : 'false', sw: on ? 2.2 : 1.8, style: base + (on ? 'color: #003b2b; background: #eef3e9;' : 'color: #5c6963;') };
    });
    return { tabs };
  }
}
</script>
</body>
</html>
