<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin edit product</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fbfaf5}
a{color:#003b2b}a:hover{color:#062a20}
.panel{background:#fffef9;border:1px solid #dfe5dc;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.h2{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:20px}
.lbl{display:block;margin:0 0 6px;font-size:13px;font-weight:600}
.in{box-sizing:border-box;width:100%;min-height:44px;padding:0 12px;border-radius:9px;border:1px solid #b8c7bd;background:#fff;font:14px 'DM Sans',sans-serif;color:#10241c}
.ta{box-sizing:border-box;width:100%;padding:10px 12px;border-radius:9px;border:1px solid #b8c7bd;background:#fff;font:14px 'DM Sans',sans-serif;color:#10241c;resize:vertical}
.slot{aspect-ratio:1;border-radius:10px;background:#eef3e9;display:grid;place-items:center;color:#5c6963;font-size:12px;text-align:center}
</style>
</helmet>
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #10241c; background: #fbfaf5; min-height: 1020px; display: flex; flex-wrap: wrap">
  <aside style="flex: 0 0 240px; background: #003b2b">
    <dc-import name="AdminSide" current="products" hint-size="240px,860px"></dc-import>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; max-width: 1080px">
    <a href="AdminProducts.dc.html" style="font-size: 14px; font-weight: 700">← Products</a>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
      <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 34px">TP-Link CPE210</h1>
      <div style="display: flex; gap: 10px; align-items: center">
        <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}"><span role="status" style="color: #345000; font-weight: 700; font-size: 14px">Saved · live in the store</span></sc-if>
        <button type="button" onClick="{{save}}" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 9px; background: #b9ee2e; color: #15210c; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">Save product</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <section aria-labelledby="dt" class="panel">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
            <h2 id="dt" class="h2">Name and description</h2>
            <div role="tablist" aria-label="Language" style="display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #eef3e9">
              <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
                <button type="button" role="tab" aria-selected="{{l.sel}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
              </sc-for>
            </div>
          </div>
          <div><label class="lbl" for="pn">Name ({{langName}})</label><input class="in" id="pn" value="{{name}}"></div>
          <div><label class="lbl" for="pd">Description ({{langName}})</label><textarea class="ta" id="pd" rows="4">{{desc}}</textarea></div>
        </section>
        <section aria-labelledby="ph" class="panel">
          <h2 id="ph" class="h2">Photos</h2>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
            <div class="slot" style="border: 2px solid #003b2b">Main photo</div><div class="slot">Photo 2</div><div class="slot">Photo 3</div>
            <button type="button" class="slot" style="border: 2px dashed #b8c7bd; cursor: pointer; font: 600 13px 'DM Sans', sans-serif">+ Add</button>
          </div>
          <p style="margin: 0; color: #5c6963; font-size: 13px">JPG, PNG or WebP. Large images are resized.</p>
        </section>
      </div>
      <div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <section aria-labelledby="pr" class="panel">
          <h2 id="pr" class="h2">Price and stock</h2>
          <div><label class="lbl" for="pp">Price (FCFA)</label><input class="in" id="pp" placeholder="[PRICE]"></div>
          <div><label class="lbl" for="psk">SKU</label><input class="in" id="psk" value="ND-TPLINK-CPE210" style="font-family: ui-monospace, Menlo, monospace"></div>
          <div><label class="lbl" for="pc">Category</label><select class="in" id="pc"><option>Outdoor networking</option><option>Travel routers</option><option>Wi-Fi devices</option></select></div>
          <div class="row" style="display: flex; justify-content: space-between; font-size: 14px"><span>In stock</span><strong>6 · <a href="AdminProducts.dc.html">adjust</a></strong></div>
        </section>
        <section aria-labelledby="vis" class="panel">
          <h2 id="vis" class="h2">Visibility</h2>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #003b2b">Show in the store</label>
          <div><label class="lbl" for="pw">Warranty</label><input class="in" id="pw" placeholder="[CONFIRM BEFORE LAUNCH]"></div>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1020}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'en', saved: false }; }
  renderVals() {
    const s = this.state;
    const copy = {
      en: { langName: 'English', name: 'TP-Link CPE210', desc: 'Outdoor 2.4 GHz wireless CPE with a directional 9 dBi antenna, for point-to-point links. Installation and alignment are required.' },
      fr: { langName: 'Français', name: 'TP-Link CPE210', desc: 'CPE extérieur 2,4 GHz avec antenne directionnelle de 9 dBi, pour les liaisons point à point. Installation et orientation nécessaires.' }
    }[s.lang];
    const base = 'min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; font: 700 13px "DM Sans", sans-serif; cursor: pointer; ';
    const langs = [['en', 'EN'], ['fr', 'FR']].map(([id, label]) => ({ label, sel: id === s.lang ? 'true' : 'false', style: base + (id === s.lang ? 'background: #ffffff; color: #003b2b;' : 'background: transparent; color: #3d4a44;'), pick: () => this.setState({ lang: id }) }));
    return { ...copy, langs, saved: s.saved, save: () => this.setState({ saved: true }) };
  }
}
</script>
</body>
</html>
