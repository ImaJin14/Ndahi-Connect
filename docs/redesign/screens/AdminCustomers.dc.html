<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin customers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fbfaf5}
a{color:#003b2b}a:hover{color:#062a20}
td,th{text-align:left;padding:12px 10px;border-bottom:1px solid #dfe5dc;font-size:14px;white-space:nowrap}
th{color:#5c6963;font-weight:600;font-size:13px}
</style>
</helmet>
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #10241c; background: #fbfaf5; min-height: 1020px; display: flex; flex-wrap: wrap">
  <aside style="flex: 0 0 240px; background: #003b2b">
    <dc-import name="AdminSide" current="customers" hint-size="240px,780px"></dc-import>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; max-width: 1080px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div>
        <p style="margin: 0 0 6px; color: #4d6b00; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase">People</p>
        <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 36px">Your customers.</h1>
      </div>
      <label for="cs" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search customers</label>
      <input id="cs" placeholder="Search name or phone" style="min-height: 44px; width: 260px; padding: 0 12px; border-radius: 9px; border: 1px solid #b8c7bd; background: #ffffff; font: 14px 'DM Sans', sans-serif">
    </div>

    <section aria-label="Customer list" style="background: #fffef9; border: 1px solid #dfe5dc; border-radius: 16px; padding: 14px 22px 22px">
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse">
          <thead><tr><th scope="col">Customer</th><th scope="col">Phone</th><th scope="col">Bundle</th><th scope="col">Devices</th><th scope="col">Store orders</th><th scope="col">Status</th><th scope="col"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
              <tr>
                <td><a href="AdminCustomerDetail.dc.html" style="font-weight: 700">{{r.name}}</a></td><td>{{r.phone}}</td><td>{{r.bundle}}</td><td>{{r.devices}}</td><td>{{r.orders}}</td>
                <td><span style="{{r.pill}}">{{r.status}}</span></td>
                <td><button type="button" onClick="{{r.flip}}" style="{{r.btnStyle}}">{{r.action}}</button></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <p style="margin: 12px 0 0; color: #5c6963; font-size: 13px">Suspending signs the customer out and disconnects their devices. It asks for your confirmation and is logged.</p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1020}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { suspended: ['e'] }; }
  renderVals() {
    const s = this.state;
    const base = [
      { id: 'a', name: 'Amina N.', phone: '6•• •• 12 45', bundle: '[PLAN 2] · 3.2 GB left', devices: '2 / 3', orders: '2' },
      { id: 'b', name: 'J. Fon', phone: '6•• •• 40 19', bundle: '[PLAN 3] · 11 GB left', devices: '3 / 3', orders: '1' },
      { id: 'c', name: 'M. Ekane', phone: '6•• •• 77 31', bundle: 'Payment waiting', devices: '0 / 1', orders: '0' },
      { id: 'd', name: 'Grace T.', phone: '6•• •• 03 66', bundle: 'None', devices: '0', orders: '0' },
      { id: 'e', name: 'K. Nji', phone: '6•• •• 59 20', bundle: '[PLAN 1] · expired', devices: '0', orders: '0' }
    ];
    const rows = base.map((r) => {
      const sus = s.suspended.includes(r.id);
      return {
        ...r,
        status: sus ? 'Suspended' : 'Active',
        pill: 'padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + (sus ? 'background: #fbe4e4; color: #8a2a2a;' : 'background: #eaf6d5; color: #345000;'),
        action: sus ? 'Restore' : 'Suspend',
        btnStyle: 'min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #dfe5dc; background: #ffffff; font: 700 13px "DM Sans", sans-serif; cursor: pointer; ' + (sus ? 'color: #003b2b;' : 'color: #a73535;'),
        flip: () => this.setState({ suspended: sus ? s.suspended.filter((x) => x !== r.id) : [...s.suspended, r.id] })
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
