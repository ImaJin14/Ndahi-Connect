<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passkey sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#003b2b}a:hover{color:#062a20}
.btn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:0 16px;border:0;border-radius:10px;background:#b9ee2e;color:#15210c;font:700 16px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer}
.back{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;text-decoration:none;color:#10241c}
.key{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#fffef9;border:1px solid #dfe5dc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'DM Sans', system-ui, sans-serif; color: #10241c; background: #fbfaf5; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #dfe5dc">
    <a class="back" href="PhoneAccount.dc.html" aria-label="Back to account"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg></a>
    <span style="font-weight: 700; font-size: 15px">Passkey sign-in</span>
  </div>
  <main style="flex: 1; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="padding: 18px; border-radius: 16px; background: #003b2b; color: #ffffff">
      <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 24px">Sign in with your fingerprint or face</h1>
      <p style="margin: 8px 0 0; color: #c8d8d0; font-size: 14px; line-height: 1.5">A passkey stays on your phone. Nobody can steal it the way they can guess a PIN.</p>
    </div>
    <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 700">Your passkeys</h2>
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="1">
      <div class="key">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #eef3e9; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#003b2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 1-3.9 5H8v3H5v-3H3V9h8.1A4 4 0 0 1 15 7Z"></path></svg></span>
        <span style="flex: 1"><strong style="display: block; font-size: 15px">{{k.name}}</strong><span style="font-size: 13px; color: #5c6963">{{k.meta}}</span></span>
        <button type="button" onClick="{{k.remove}}" aria-label="{{k.removeLabel}}" style="min-height: 44px; padding: 0 12px; border-radius: 9px; border: 1px solid #dfe5dc; background: #ffffff; color: #a73535; font: 700 13px 'DM Sans', sans-serif; cursor: pointer">Remove</button>
      </div>
    </sc-for>
    <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding: 14px; border-radius: 12px; background: #eef3e9; color: #3d4a44; font-size: 14px">No passkeys yet. You'll sign in with your PIN.</p>
    </sc-if>
    <button type="button" class="btn" onClick="{{add}}" style="margin-top: auto">Add a passkey on this phone</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { keys: [{ id: 1, name: 'Android phone', meta: 'Added 2 Nov · last used today' }] }; }
  renderVals() {
    const ks = this.state.keys;
    const keys = ks.map((k) => ({ ...k, removeLabel: 'Remove passkey on ' + k.name, remove: () => this.setState({ keys: ks.filter((x) => x.id !== k.id) }) }));
    return {
      keys, none: ks.length === 0,
      add: () => this.setState({ keys: [...ks, { id: Date.now(), name: 'This phone', meta: 'Added just now' }] })
    };
  }
}
</script>
</body>
</html>
