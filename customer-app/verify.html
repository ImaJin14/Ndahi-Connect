<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Authenticator verification — NDAHI Connect</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><a class="brand" href="/onboarding.html"><span class="brand-mark">NC</span><span><strong>NDAHI</strong><small>CONNECT</small></span></a><div class="header-actions"><span class="network-state">Secure verification</span></div></header>
<main><section class="card narrow"><a href="/login" class="back-link">← Back to login</a><p class="eyebrow" id="step">Secure access</p><h1 id="title">Authenticator verification.</h1><p id="instructions">Enter the six-digit code from your authenticator app.</p><form id="verify"><label id="primaryLabel">Verification code<input id="primary" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus></label><label id="confirmLabel" hidden>Confirm PIN<input id="confirm" name="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4}" maxlength="4" placeholder="••••"></label><button id="submitLabel">Verify and continue</button></form><div id="development"></div><div id="message" class="error" role="alert" aria-live="assertive"></div></section></main>
<footer class="footer-note">Authenticator codes rotate every 30 seconds</footer><script src="/config.js"></script><script type="module" src="/verify.js"></script></body></html>
