<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>My connection — NDAHI Connect</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/dashboard"><span class="brand-mark">NC</span><span><strong>NDAHI</strong><small>CONNECT</small></span></a><div class="header-actions"><span class="network-state">Checking status…</span><button id="logout">Logout</button></div></header><main class="dashboard-shell"><div class="welcome"><div><p class="eyebrow">Customer dashboard</p><h1>Your connection at a glance.</h1></div></div><div id="dashboardMessage" class="error" role="alert"></div><div id="dashboard">Loading your account…</div><section class="surface" id="activateDevice"><details id="differentCode"><summary>Activate a different voucher code</summary><form id="redeem"><div class="form-row"><label>Phone number<input name="phone" placeholder="6XXXXXXXX" required></label><label>Activation code<input name="code" placeholder="NC-XXXX-XXXX" required></label></div><label>Device name<input name="label" placeholder="e.g. Marie’s laptop"></label><button>Connect this device</button></form><div id="redeemMessage" role="status" aria-live="polite"></div></details></section></main><dialog id="receiptDialog" class="receipt-dialog" aria-labelledby="receiptTitle" aria-modal="true"><div class="receipt-dialog-header"><h2 id="receiptTitle">Payment receipt</h2><button type="button" id="receiptClose" class="secondary-action" autofocus>Close</button></div><div id="receiptPreview" class="receipt-preview"></div><div id="receiptMessage" role="status" aria-live="polite"></div><div class="receipt-dialog-actions"><button type="button" id="receiptDownload" hidden>Download PDF</button></div></dialog><script src="/config.js"></script><script src="/vendor/webauthn.js"></script><script type="module" src="/app.js"></script></body></html>
