<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NDAHI design QA comparison</title>
    <style>
    body {
      margin: 0;
      background: #222;
      color: #fff;
      font: 16px system-ui;
    }
    h2 {
      margin: 14px 18px;
    }
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
    }
    .panel {
      background: #111;
      padding: 8px;
    }
    .panel b {
      display: block;
      padding: 8px;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
    }
    </style>
  </head>
  <body>
    <h2>Option 1 source vs. onboarding implementation · 1440 × 1024</h2>
    <div class="compare">
      <div
        class="panel"><b>Selected source</b><img src="qa-assets/selected-option-1.png"></div>
      <div
        class="panel"><b>Rendered implementation</b><img src="qa-assets/onboarding-implementation.png"></div>
    </div>
  </body>
</html>
