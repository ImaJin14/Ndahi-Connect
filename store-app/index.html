<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Networking equipment from NDAHI Connect. Browse devices, pay with Mobile Money and collect locally."
    />
    <title>NDAHI Store — Better connections</title>
    <link rel="stylesheet" href="/shared/ui/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <meta name="theme-color" content="#003b2b" />
    <meta name="apple-mobile-web-app-title" content="NDAHI Store" />
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <a class="brand" href="/" aria-label="NDAHI Store home"
        ><span class="brand-mark">NS</span
        ><span
          >NDAHI<span class="brand-sub" id="storeName"
            >STORE</span
          ></span
        ></a
      >
      <nav aria-label="Main">
        <a href="#shop" data-nav="shop" data-label="shop" class="wide">Shop</a
        ><a href="#orders" data-nav="orders"><span class="narrow" data-label="trackShort">Track order</span><span class="wide" data-label="trackLong">Track an order</span></a
        ><a id="internetNav" class="wide" target="_blank" rel="noopener" data-label="internetNav">Internet packages</a>
      </nav>
      <a id="portal" class="header-signin" target="_blank" rel="noopener" data-label="account">Sign in</a>
    </header>
    <main id="main">
      <div id="message" role="status" aria-live="polite"></div>
      <div id="view"><p>Loading store…</p></div>
    </main>
    <footer>
      <a class="brand" href="/">NDAHI CONNECT</a>
      <p id="footerText">Equipment for your everyday connections.</p>
      <p id="storeContact"></p>
      <a id="internet" target="_blank" rel="noopener">Internet packages ↗</a>
      <details class="policy footer-policies" id="footerPolicies"></details>
    </footer>
    <dialog id="checkoutDialog" aria-labelledby="checkoutTitle">
      <div class="sheet-bar"><button class="close" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 18 9 12l6-6"/></svg></button><span class="sheet-bar__title">Checkout</span></div>
      <div id="checkoutDetail"></div>
    </dialog>
  </body>
</html>
